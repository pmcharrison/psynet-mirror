{% extends "timeline-page.html" %}

{% block head %}
    {{ super() }}
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | CarGameUnity</title>
    <link rel="shortcut icon" href="/static/scripts/TemplateData/favicon.ico">
    <link rel="stylesheet" href="/static/scripts/TemplateData/style.css">
    <script src="/static/scripts/TemplateData/UnityProgress.js" type="text/javascript"></script>
    <script src="/static/scripts/Build/UnityLoader.js" type="text/javascript"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "/static/scripts/Build/WebGL.json", {onProgress: UnityProgress});
    </script>
{% endblock %}

{% block stylesheets %}
    {{ super() }}
    <!-- <link rel="stylesheet" type="text/css" href="static/css/custom.css"> -->
{% endblock %}

{% block main_body %}
    <div class="main_div">
        <p>
            <div class="webgl-content">
                <div id="gameContainer" style="width: 960px; height: 600px"></div>
                <div class="footer">
                    <div class="webgl-logo"></div>
                    <div class="fullscreen" onclick="gameInstance.SetFullscreen(1)"></div>
                    <div class="title">CarGameUnity</div>
                </div>
            </div>
        </p>
    </div>
{% endblock %}

{% block libs %}
    {{ super() }}
    <script src="/static/scripts/markdown.min.js" type="text/javascript"> </script>
    <script src="/static/scripts/experiment.js" type="text/javascript"> </script>
    <!-- <script src="/static/TemplateData/UnityProgress.js" type="text/javascript"></script>
    <script src="/static/Build/UnityLoader.js" type="text/javascript"></script> -->
{% endblock %}
