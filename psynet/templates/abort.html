{% extends "layout.html" %}

{% block stylesheets %}
    <style>
      body {
          padding:0px;
          margin: 0px;
          background-color: white;
          color: black;
          font-weight: 300;
          font-size: 13pt;
      }

      #container {
          position: absolute;
          top: 0px; /* Header Height */
          bottom: 0px; /* Footer Height */
          left: 0px;
          right: 0px;
          padding: 100px;
          padding-top: 5%;
          border: 18px solid #f3f3f3;
          background: white;
      }
    </style>
{% endblock %}

{% block body %}
    <div id="container">
      <div style="max-width: max-content;">
        <div class="col-xs-2">
          <img id="adlogo" src="/static/images/logo.png" alt="PsyNet Logo" style="width: 150px; float: left;">
        </div>
        <h1 style="clear: both;">Experiment aborted!</h1>
        <hr>
        <p>
          See information below on your compensation for participating in the experiment.
        </p>
        <table class="table table-sm table-striped">
            <tbody>
            {% for key, value in participant_abort_info %}
                <tr><th>{{ key }}</th><td>{{ value }}</td></tr>
            {% endfor %}
            </tbody>
        </table>
      </div>
    </div>
{% endblock %}
