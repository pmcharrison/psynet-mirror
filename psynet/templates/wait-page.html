{% extends "timeline-page.html" %}

{% block stylesheets %}
    {{ super() }}
    <style data-psynet-fragment-style="true">
        /* The waiting animation is full-bleed, so opt out of the content surface.
           This column takes the space between the progress bar and the footer
           rather than claiming a full viewport of its own. */
        #main-body {
            padding: 0 !important;
            margin: 0 !important;
            max-width: none;
            background: none;
            border: none;
            border-radius: 0;
            box-shadow: none;
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* Fill the viewport below the progress bar. Footer clearance is
           padding on this element only when a footer is present, so generic
           and local recruitment do not keep a blank band at the bottom. */
        #wait-page {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1 1 auto;
            min-height: calc(100vh - var(--psynet-progress-height));
            padding: 2rem;
            text-align: center;
        }

        /* The footer already occupies layout space, so a viewport min-height
           here would overflow by about one footer. */
        #timeline-root:has(#footer) #wait-page {
            min-height: 0;
        }

        #wait-page p {
            margin: 0;
            font-size: clamp(1.75rem, 5vw, 3rem);
            font-weight: 600;
            text-wrap: balance;
        }
    </style>

{% endblock %}

{% block main_body %}
    <div class="colorfadeanim" id="wait-page">
        <p>{{ content }}</p>
    </div>
{% endblock %}
