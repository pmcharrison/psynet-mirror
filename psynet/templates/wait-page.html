{% extends "timeline-page.html" %}

{% block stylesheets %}
    {{ super() }}
    <style data-psynet-fragment-style="true">
        /* The waiting animation is full-bleed. This page still has a footer,
           so the theme would reserve body clearance; put that padding on
           #wait-page instead so the animation fills the window. */
        body:has(#footer) {
            padding-bottom: 0;
        }

        /* The waiting animation is full-bleed, so opt out of the content surface. */
        #main-body {
            padding: 0 !important;
            margin: 0 !important;
            max-width: none;
            background: none;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        /* Fill the viewport below the progress bar. Footer clearance is padding
           rather than a subtracted magic height, so wrapping footer content
           cannot create a stray scrollbar. */
        #wait-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--psynet-progress-height));
            padding: 2rem 2rem var(--psynet-footer-clearance);
            text-align: center;
        }

        #wait-page p {
            margin: 0;
            font-size: clamp(1.75rem, 5vw, 3rem);
            font-weight: 600;
            text-wrap: balance;
        }
    </style>

{% endblock %}

{% block main_body %}
    <div class="colorfadeanim" id="wait-page">
        <p>{{ content }}</p>
    </div>
{% endblock %}
