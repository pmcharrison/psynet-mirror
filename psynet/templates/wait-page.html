{% extends "timeline-page.html" %}

{% block stylesheets %}
    {{ super() }}
    <style data-psynet-fragment-style="true">
        .vcenter {
            display: inline-block;
            vertical-align: middle;
            float: none;
            margin: auto;
            text-align: center;
        }

        /* The waiting animation is full-bleed, so opt out of the content surface. */
        #main-body {
            padding: 0 !important;
            margin: 0 !important;
            max-width: none;
            background: none;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        #wait-page p {
            font-size: 3em;
            font-weight: 600;
        }
    </style>

{% endblock %}

{% block main_body %}
    <div class="row colorfadeanim" id="wait-page" style="height: 100%">
        <div class="col-10 vcenter">
            <p>{{ content }}</p>
        </div>
    </div>
{% endblock %}
