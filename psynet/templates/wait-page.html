{% extends "timeline-page.html" %}

{% block stylesheets %}
    {{ super() }}
    <style data-psynet-fragment-style="true">
        /* The waiting animation is full-bleed. When a footer is present, the
           theme would reserve body clearance; put that padding on #wait-page
           instead so the animation fills the window. */
        body:has(#footer) {
            padding-bottom: 0;
        }

        /* The waiting animation is full-bleed, so opt out of the content surface. */
        #main-body {
            padding: 0 !important;
            margin: 0 !important;
            max-width: none;
            background: none;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        /* Fill the viewport below the progress bar. Footer clearance is
           padding on this element only when a footer is present, so generic
           and local recruitment do not keep a blank band at the bottom. */
        #wait-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--psynet-progress-height));
            padding: 2rem;
            text-align: center;
        }

        body:has(#footer) #wait-page {
            padding-bottom: var(--psynet-footer-clearance);
        }

        #wait-page p {
            margin: 0;
            font-size: clamp(1.75rem, 5vw, 3rem);
            font-weight: 600;
            text-wrap: balance;
        }
    </style>

{% endblock %}

{% block main_body %}
    <div class="colorfadeanim" id="wait-page">
        <p>{{ content }}</p>
    </div>
{% endblock %}
