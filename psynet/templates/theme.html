{% macro logo(id, extra_class_name) %}
    <div id="logo_container">
        <div id="psynet_logo" class="float-start col">
            {{ experiment.psynet_logo }}
        </div>
        <div id="lab_logos" class="col">
            {% for logo in experiment.lab_logos %}
                <div class="logo">{{ logo }}</div>
            {% endfor %}
        </div>
    </div>
{% endmacro %}

<div style="display: none" class="hidden_logos">
    {{ logo("logo", "mr-3") }}
</div>

<script>
    // replace logos
    document.addEventListener("DOMContentLoaded", function (event) {
        let svg = $({{ logo("logo", "mr-3") | tojson }});
        var oldLogo = $('#adlogo');
        if (oldLogo.length > 0) {
            $(oldLogo[0].parentElement).append(svg);
            oldLogo.remove();
        }
    });

    /*!
 * Color mode toggler for Bootstrap's docs (https://getbootstrap.com/)
 * Copyright 2011-2023 The Bootstrap Authors
 * Licensed under the Creative Commons Attribution 3.0 Unported License.
 */

    (() => {
        'use strict'

        const storedTheme = "{{ experiment.var.color_mode }}"

        const getPreferredTheme = () => {
            if (storedTheme) {
                return storedTheme
            }

            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }

        const setTheme = function (theme) {
            console.log(theme)
            if (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-bs-theme', 'dark')
            } else {
                document.documentElement.setAttribute('data-bs-theme', theme)
            }
        }

        setTheme(getPreferredTheme())

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            setTheme(getPreferredTheme())
        })
    })()

</script>
