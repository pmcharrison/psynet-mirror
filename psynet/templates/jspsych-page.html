{% extends "timeline-page.html" %}

{% block main_body %}
    {{ super() }}
    <div id="js-psych" style="margin: 0px; height: 70%; width: 100%;"></div>
{% endblock main_body %}

{% block scripts %}
    {{ super() }}
    <script>
        globalThis.jsPsych = initJsPsych({
            display_element: document.getElementById("js-psych"),
            on_finish: function () {
                if (typeof globalThis.psynetJsPsychOnFinish === "function") {
                    return globalThis.psynetJsPsychOnFinish();
                }
            }
        });
    </script>
    {% block timeline %}
    {% endblock timeline %}
    <script>
        if (typeof timeline === "undefined") {
            throw new Error(
                "The jsPsych timeline object could not be found. " +
                "Please check the timeline script for errors."
            );
        }
        globalThis.psynetJsPsychTimeline = timeline;
    </script>
{% endblock scripts %}
