{% macro null(input) %}
    <div class="row">
        <div class="col-xs-10"></div>
        <div class="col-xs-2">
            <button type="button" id="next_button" class="btn btn-success btn-lg response"
                    onclick="psynet.next_page();">Next
            </button>
        </div>
    </div>
{% endmacro %}

{% macro nafc_button(config) %}
    <div class="{{ 'radio' if config.own_line else 'radio-inline' }}">
        <label>
            <input type="radio" id="{{ config.id }}" name="optradio"
                   onclick="clicked_button('{{ config.id }}');">
            {{ config.label }}
        </label>
    </div>
{% endmacro %}

{% macro nafc(config) %}
    <div>
        {% for button in config.buttons %}
            {{ nafc_button(button) }}
        {% endfor %}
    </div>

    <script>
        clicked_button = function (id) {
            psynet.response.disable();
            psynet.next_page(id);
        }
    </script>
{% endmacro %}
