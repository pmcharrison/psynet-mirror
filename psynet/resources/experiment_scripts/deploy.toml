# Deployment selection is independent of Git.
# exclude entries are literal, root-relative prefixes.
# exclude_anywhere entries are literal basenames or *.suffix patterns
# matched in every directory. Other Git globs and negation are not supported.
version = 1

exclude = [
    ".deploy",
    "data",
    "deploy",
    "deploy_logs",
    "develop",
    "local_only",
    "snapshots",
    "static/assets",
]

exclude_anywhere = [
    "*.db",
    "*.dmg",
    ".env",
    ".pytest_cache",
    ".python-version",
    ".venv",
    "__pycache__",
    "logs.jsonl",
    "node_modules",
    "server.log",
    "source_code.zip",
]
