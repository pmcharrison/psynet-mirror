{% extends "base/consent.html" %}

{% block body %}
<div class="container" style="margin-top: 130px;text-align: -webkit-center;">
  <div style="max-width: max-content;">
    <div class="col-xs-2">
      <img id="adlogo" src="/static/images/logo.png" alt="PsyNet Logo" style="width: 200px; float: left;">
    </div>
    <h3 style="clear: both;">
      To proceed, please click the button below
    </h3>
    <div style="float: right;">
      <button
        type="button"
        class="btn btn-primary btn-lg"
        id="consent_button"
        style="margin-top: 20px;"
        onClick="window.location='/start?{{query_string | safe}}';">
        Next
      </button>
    </div>
  </div>
</div>
{% endblock %}
