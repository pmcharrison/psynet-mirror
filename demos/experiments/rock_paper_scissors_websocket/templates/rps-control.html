{% macro rps_control(config) %}
<style>
    #rps-board {
        max-width: 480px;
        margin: 1rem auto 0;
        text-align: center;
    }

    #rps-status {
        min-height: 1.5rem;
        margin-bottom: 0.75rem;
        font-weight: bold;
    }

    #rps-buttons {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        margin-bottom: 1rem;
    }

    #rps-log {
        text-align: left;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        padding: 0.75rem;
        background: #fafafa;
        min-height: 120px;
        max-height: 220px;
        overflow-y: auto;
    }

    #rps-log p {
        margin-bottom: 0.4rem;
    }
</style>

<div id="rps-board">
    <div id="rps-round"></div>
    <div id="rps-score"></div>
    <div id="rps-status"></div>

    <div id="rps-buttons">
        {% for choice in config.choices %}
        <button
            type="button"
            class="btn btn-primary btn-lg rps-choice"
            data-action="{{ choice }}"
            style="border-color: {{ config.color }};"
            disabled
        >{{ choice }}</button>
        {% endfor %}
    </div>

    <div id="rps-log"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var ROOM_ID  = {{ config.room_id | tojson }};
        var CHANNEL  = {{ config.channel | tojson }};
        var N_ROUNDS = {{ config.n_rounds }};
        var MY_ID    = String(dallinger.identity.participantId);

        var currentRound = 1;
        var myMoves = [];

        var buttons = Array.prototype.slice.call(
            document.getElementsByClassName("rps-choice")
        );
        var roundEl  = document.getElementById("rps-round");
        var scoreEl  = document.getElementById("rps-score");
        var statusEl = document.getElementById("rps-status");
        var logEl    = document.getElementById("rps-log");

        function setButtonsEnabled(enabled) {
            buttons.forEach(function (b) { b.disabled = !enabled; });
        }

        function showRound() {
            roundEl.textContent = "Round " + currentRound + " of " + N_ROUNDS;
            statusEl.textContent = "Choose your action.";
            setButtonsEnabled(true);
        }

        function outcomeText(roundScore) {
            if (roundScore > 0) return "You won the round!";
            if (roundScore < 0) return "You lost the round.";
            return "The round was a draw.";
        }

        var wsScheme = location.protocol === "https:" ? "wss://" : "ws://";
        var gameSocket = new ReconnectingWebSocket(
            wsScheme + location.host + "/chat?channel=" + CHANNEL
            + "&worker_id=" + dallinger.identity.workerId
            + "&participant_id=" + MY_ID
        );

        gameSocket.onopen = function () {
            showRound();
        };

        gameSocket.onmessage = function (event) {
            if (event.data.indexOf(CHANNEL + ":") !== 0) return;
            var msg;
            try {
                msg = JSON.parse(event.data.slice(CHANNEL.length + 1));
            } catch (e) { return; }

            if (msg.type !== "reveal") return;
            if (String(msg.room_id) !== String(ROOM_ID)) return;
            if (Number(msg.round) !== currentRound) return;

            var partnerId = Object.keys(msg.moves).filter(function (id) {
                return id !== MY_ID;
            })[0];

            var myMove      = msg.moves[MY_ID];
            var partnerMove = msg.moves[partnerId];
            var roundScore  = msg.round_scores[MY_ID];
            var myTotal     = msg.total_scores[MY_ID];
            var partnerTotal = msg.total_scores[partnerId];

            myMoves[currentRound - 1] = myMove;

            var line = document.createElement("p");
            line.textContent =
                "Round " + currentRound + ": you played " + myMove
                + ", your partner played " + partnerMove + ". "
                + outcomeText(roundScore);
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;

            scoreEl.textContent = "Score — you: " + myTotal
                + ", partner: " + partnerTotal;

            if (currentRound >= N_ROUNDS) {
                statusEl.textContent = "Game over! Submitting your results…";
                psynet.nextPage(myMoves);
            } else {
                currentRound += 1;
                showRound();
            }
        };

        buttons.forEach(function (button) {
            button.onclick = function () {
                setButtonsEnabled(false);
                statusEl.textContent = "Waiting for your partner…";
                gameSocket.send(CHANNEL + ":" + JSON.stringify({
                    type: "choose",
                    room_id: ROOM_ID,
                    round: currentRound,
                    action: button.getAttribute("data-action"),
                    // ``sender`` is how Dallinger resolves the participant that
                    // a WebSocket message belongs to (see Experiment.send).
                    sender: MY_ID,
                }));
            };
        });
    });
</script>
{% endmacro %}
