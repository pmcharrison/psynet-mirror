{% macro rps_control(config) %}
<style>
    #rps-board { max-width: 480px; margin: 1rem auto 0; text-align: center; }
    #rps-status { min-height: 1.5rem; margin-bottom: 0.75rem; font-weight: bold; }
    #rps-buttons { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 1rem; }
    #rps-log {
        text-align: left; border: 1px solid #dee2e6; border-radius: 4px;
        padding: 0.75rem; background: #fafafa; min-height: 120px;
        max-height: 220px; overflow-y: auto;
    }
    #rps-log p { margin-bottom: 0.4rem; }
</style>

<div id="rps-board">
    <div id="rps-score">Score — you: 0, partner: 0</div>
    <div id="rps-status">Round 1 of {{ config.n_rounds }}: choose your action.</div>

    <div id="rps-buttons">
        {% for choice in config.choices %}
        <button type="button" class="btn btn-primary btn-lg rps-choice"
                data-action="{{ choice }}"
                style="border-color: {{ config.color }};" disabled>{{ choice }}</button>
        {% endfor %}
    </div>

    <div id="rps-log"></div>
</div>

<script>
    // The server owns the game: this script only sends the chosen action,
    // pulls fresh state for recovery, and renders targeted reveal events.
    psynet.trial.onEvent("liveSessionInit", function () {
        var nRounds = {{ config.n_rounds | tojson }};
        var participantId = String(psynet.session.participant_id);
        var round     = 1;
        var completed = false;
        var finalSubmitted = false;
        var finalAnswer = null;

        var buttons  = Array.prototype.slice.call(
            document.getElementsByClassName("rps-choice")
        );
        var statusEl = document.getElementById("rps-status");
        var scoreEl  = document.getElementById("rps-score");
        var logEl    = document.getElementById("rps-log");

        function setEnabled(enabled) {
            buttons.forEach(function (b) { b.disabled = !enabled; });
        }

        function appendReveal(msg) {
            var line = document.createElement("p");
            line.textContent = msg.result;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
            scoreEl.textContent = msg.scoreboard;
            statusEl.textContent = msg.status;
        }

        function participantHasSubmitted(state) {
            return (
                (state.submitted_participant_ids || [])
                    .map(String)
                    .indexOf(participantId) !== -1
            );
        }

        function advanceIfFinished(reveal) {
            if (!reveal || !reveal.finished || finalSubmitted) return;
            completed = true;
            finalSubmitted = true;
            finalAnswer = reveal.answer;
            setEnabled(false);
            psynet.nextPage(finalAnswer);
        }

        function promptForCurrentRound() {
            statusEl.textContent = (
                "Round " + round + " of " + nRounds + ": choose your action."
            );
        }

        function renderFreshState(freshState) {
            if (!freshState) return;

            // Fresh state is for recovery after initial load/reconnect. Normal
            // round progress is communicated by targeted roundReveal events.
            var state = freshState.state || {};
            var history = state.reveal_history || [];
            round = state.current_round || round;
            logEl.innerHTML = "";
            history.forEach(appendReveal);

            if (history.length === 0) {
                scoreEl.textContent = "Score — you: 0, partner: 0";
                promptForCurrentRound();
            }

            var latest = history[history.length - 1];
            if (latest && latest.finished) {
                setEnabled(false);
                completed = true;
                finalAnswer = latest.answer;
                advanceIfFinished(latest);
                return;
            }

            if (!freshState.started) {
                statusEl.textContent = "Waiting for your partner to load the game…";
                setEnabled(false);
            } else if (participantHasSubmitted(state)) {
                statusEl.textContent = "Waiting for your partner…";
                setEnabled(false);
            } else {
                promptForCurrentRound();
                setEnabled(true);
            }
        }

        function startLiveRound() {
            if (completed || participantHasSubmitted(psynet.session.state || {})) {
                return;
            }
            promptForCurrentRound();
            setEnabled(true);
        }

        function applyRoundReveal(reveal) {
            appendReveal(reveal);
            round = reveal.round;
            if (reveal.finished) {
                advanceIfFinished(reveal);
            } else {
                setEnabled(true);
            }
        }

        psynet.session.onFreshState(renderFreshState);
        psynet.session.onStarted(startLiveRound);
        psynet.websocket.handle("roundReveal", applyRoundReveal);
        psynet.session.ready();

        buttons.forEach(function (button) {
            button.onclick = function () {
                if (completed || button.disabled) return;
                setEnabled(false);
                statusEl.textContent = "Waiting for your partner…";
                psynet.websocket.send("choose", {
                    round: round,
                    action: button.getAttribute("data-action")
                });
            };
        });
    });
</script>
{% endmacro %}
