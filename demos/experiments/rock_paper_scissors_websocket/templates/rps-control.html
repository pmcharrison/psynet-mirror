{% macro rps_control(config) %}
<style>
    #rps-board { max-width: 480px; margin: 1rem auto 0; text-align: center; }
    #rps-status { min-height: 1.5rem; margin-bottom: 0.75rem; font-weight: bold; }
    #rps-buttons { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 1rem; }
    #rps-log {
        text-align: left; border: 1px solid #dee2e6; border-radius: 4px;
        padding: 0.75rem; background: #fafafa; min-height: 120px;
        max-height: 220px; overflow-y: auto;
    }
    #rps-log p { margin-bottom: 0.4rem; }
</style>

<div id="rps-board">
    <div id="rps-score">Score — you: 0, partner: 0</div>
    <div id="rps-status">Round 1 of {{ config.n_rounds }}: choose your action.</div>

    <div id="rps-buttons">
        {% for choice in config.choices %}
        <button type="button" class="btn btn-primary btn-lg rps-choice"
                data-action="{{ choice }}"
                style="border-color: {{ config.color }};" disabled>{{ choice }}</button>
        {% endfor %}
    </div>

    <div id="rps-log"></div>
</div>

<script>
    // The server owns the game: this script only sends the chosen action and
    // renders the snapshots the server sends back (see EnableRockPaperScissors).
    document.addEventListener("DOMContentLoaded", function () {
        var CHANNEL = {{ config.channel | tojson }};
        var ROOM_ID = {{ config.room_id | tojson }};
        var MY_ID   = String(dallinger.identity.participantId);
        var round   = 1;

        var buttons  = Array.prototype.slice.call(document.getElementsByClassName("rps-choice"));
        var statusEl = document.getElementById("rps-status");
        var scoreEl  = document.getElementById("rps-score");
        var logEl    = document.getElementById("rps-log");

        function setEnabled(enabled) {
            buttons.forEach(function (b) { b.disabled = !enabled; });
        }

        var wsScheme = location.protocol === "https:" ? "wss://" : "ws://";
        var socket = new ReconnectingWebSocket(
            wsScheme + location.host + "/chat?channel=" + CHANNEL
            + "&worker_id=" + dallinger.identity.workerId
            + "&participant_id=" + MY_ID
        );

        socket.onopen = function () { setEnabled(true); };

        socket.onmessage = function (event) {
            if (event.data.indexOf(CHANNEL + ":") !== 0) return;
            var msg;
            try { msg = JSON.parse(event.data.slice(CHANNEL.length + 1)); }
            catch (e) { return; }
            if (msg.type !== "reveal" || msg.target !== MY_ID) return;

            var line = document.createElement("p");
            line.textContent = msg.result;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
            scoreEl.textContent = msg.scoreboard;
            statusEl.textContent = msg.status;

            if (msg.finished) {
                psynet.nextPage(msg.answer);
            } else {
                round = msg.round;
                setEnabled(true);
            }
        };

        buttons.forEach(function (button) {
            button.onclick = function () {
                setEnabled(false);
                statusEl.textContent = "Waiting for your partner…";
                // ``sender`` tells Dallinger which participant this message is from.
                socket.send(CHANNEL + ":" + JSON.stringify({
                    type: "choose",
                    room_id: ROOM_ID,
                    round: round,
                    action: button.getAttribute("data-action"),
                    page_uuid: pageUuid,
                    sender: MY_ID,
                }));
            };
        });
    });
</script>
{% endmacro %}
