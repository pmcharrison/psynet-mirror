{% macro rps_control(config) %}
<style>
    #rps-board { max-width: 480px; margin: 1rem auto 0; text-align: center; }
    #rps-status { min-height: 1.5rem; margin-bottom: 0.75rem; font-weight: bold; }
    #rps-buttons { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 1rem; }
    #rps-log {
        text-align: left; border: 1px solid #dee2e6; border-radius: 4px;
        padding: 0.75rem; background: #fafafa; min-height: 120px;
        max-height: 220px; overflow-y: auto;
    }
    #rps-log p { margin-bottom: 0.4rem; }
</style>

<div id="rps-board">
    <div id="rps-score">Score — you: 0, partner: 0</div>
    <div id="rps-status">Round 1 of {{ config.n_rounds }}: choose your action.</div>

    <div id="rps-buttons">
        {% for choice in config.choices %}
        <button type="button" class="btn btn-primary btn-lg rps-choice"
                data-action="{{ choice }}"
                style="border-color: {{ config.color }};" disabled>{{ choice }}</button>
        {% endfor %}
    </div>

    <div id="rps-log"></div>
</div>

<script>
    // The server owns the game: this script only sends the chosen action and
    // renders the snapshots the server sends back.
    document.addEventListener("DOMContentLoaded", function () {
        var NAMESPACE = {{ config.namespace | tojson }};
        var ROOM_ID   = {{ config.room_id | tojson }};
        var MY_ID     = String(dallinger.identity.participantId);
        var round     = 1;
        var completed = false;

        var buttons  = Array.prototype.slice.call(
            document.getElementsByClassName("rps-choice")
        );
        var statusEl = document.getElementById("rps-status");
        var scoreEl  = document.getElementById("rps-score");
        var logEl    = document.getElementById("rps-log");

        function setEnabled(enabled) {
            buttons.forEach(function (b) { b.disabled = !enabled; });
        }

        function appendReveal(msg) {
            var line = document.createElement("p");
            line.textContent = msg.result;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
            scoreEl.textContent = msg.scoreboard;
            statusEl.textContent = msg.status;
        }

        function participantHasSubmitted(state) {
            return (
                (state.submitted_participant_ids || [])
                    .map(String)
                    .indexOf(MY_ID) !== -1
            );
        }

        function renderSnapshot(snapshot) {
            if (!snapshot || snapshot.session_id !== ROOM_ID) return;

            var state = snapshot.state || {};
            var history = ((state.reveal_history || {})[MY_ID]) || [];
            round = state.current_round || round;
            logEl.innerHTML = "";
            history.forEach(appendReveal);

            if (history.length === 0) {
                scoreEl.textContent = "Score — you: 0, partner: 0";
                statusEl.textContent = (
                    "Round " + round + " of {{ config.n_rounds }}: choose your action."
                );
            }

            var latest = history[history.length - 1];
            if (latest && latest.finished) {
                setEnabled(false);
                if (!completed) {
                    completed = true;
                    psynet.nextPage(latest.answer);
                }
                return;
            }

            if (!snapshot.started) {
                statusEl.textContent = "Waiting for your partner to load the game…";
                setEnabled(false);
            } else if (participantHasSubmitted(state)) {
                statusEl.textContent = "Waiting for your partner…";
                setEnabled(false);
            } else {
                setEnabled(true);
            }
        }

        psynet.session_state.init({
            namespace: NAMESPACE,
            session_id: ROOM_ID
        });
        psynet.session_state.onSnapshot(renderSnapshot);
        psynet.session_state.ready();

        buttons.forEach(function (button) {
            button.onclick = function () {
                setEnabled(false);
                statusEl.textContent = "Waiting for your partner…";
                psynet.websocket.send("choose", {
                    round: round,
                    action: button.getAttribute("data-action")
                });
            };
        });
    });
</script>
{% endmacro %}
