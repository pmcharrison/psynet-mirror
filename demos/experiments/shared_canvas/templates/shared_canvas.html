{% macro shared_canvas_control(params) %}
<style>
  .canvas-shell {
    max-width: 760px;
    margin: 0 auto;
    font-family: system-ui, sans-serif;
    text-align: center;
  }
  .bonus-pill {
    display: inline-block;
    margin: 0.4rem 0 0.8rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    background: #fff7d6;
    border: 1px solid #f0d76b;
    color: #594300;
    font-size: 1.1rem;
    font-weight: 700;
  }
  #shared-canvas {
    width: min(640px, 92vw);
    height: min(640px, 92vw);
    border: 2px solid #22334d;
    border-radius: 14px;
    background: #f8fbff;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
  }
  #shared-canvas:focus {
    outline: 3px solid #4f8cff;
    outline-offset: 4px;
  }
  .canvas-help {
    margin: 0.75rem auto 0;
    max-width: 620px;
    color: #52606d;
  }
</style>
<div class="canvas-shell">
  <h2>Shared canvas</h2>
  <div class="bonus-pill">Coin bonus: $<span id="coin-bonus">0.00</span></div>
  <canvas id="shared-canvas" width="{{ params.canvas_config.canvas_size }}" height="{{ params.canvas_config.canvas_size }}" tabindex="0" aria-label="Shared canvas arrow-key navigation area"></canvas>
  <p class="canvas-help">Use the arrow keys to move. Collect the gold coins before the session ends.</p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var liveSession = {{ params.live_session_config | tojson }};
  var cfg = Object.assign({}, liveSession, {{ params.canvas_config | tojson }});
  var participantId = String(liveSession.participant_id);
  var canvas = document.getElementById("shared-canvas");
  var ctx = canvas.getContext("2d");
  var players = {};
  var coins = [];
  var pendingCollections = {};
  var collectedCoinIds = [];
  var keys = {};
  var arrowKeys = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"];
  var own = {
    participant_id: participantId,
    label: "You",
    color: "#1f77b4",
    x: cfg.canvas_size / 2,
    y: cfg.canvas_size / 2,
    vx: 0,
    vy: 0,
    client_time: performance.now(),
    received_at: performance.now()
  };
  var bonus = 0;
  var lastDrawAt = performance.now();
  var startedAt = null;
  var submitted = false;
  var gameStarted = false;
  var gameIntervalIds = [];

  function updateBonus(value) {
    bonus = Number(value || 0);
    document.getElementById("coin-bonus").textContent = bonus.toFixed(2);
    var performanceReward = document.getElementById("performance-reward");
    var totalReward = document.getElementById("total-reward");
    var rewardDetails = document.getElementById("reward-details");
    if (performanceReward) performanceReward.textContent = bonus.toFixed(2);
    if (totalReward) {
      var timeRewardEl = document.getElementById("time-reward");
      var timeReward = timeRewardEl ? Number(timeRewardEl.textContent || 0) : 0;
      totalReward.textContent = (timeReward + bonus).toFixed(2);
    }
    if (rewardDetails) rewardDetails.style.display = "";
  }

  function applySnapshot(msg) {
    var state = msg.state || msg;
    players = {};
    Object.keys(state.players || {}).forEach(function (playerId) {
      var player = state.players[playerId];
      players[String(playerId)] = Object.assign({}, player, {
        received_at: performance.now()
      });
    });
    if (players[participantId]) {
      own = Object.assign(own, players[participantId]);
    }
    coins = (state.coins || []).slice();
    collectedCoinIds = (state.collected_coins || [])
      .filter(function (collection) {
        return String(collection.participant_id) === participantId;
      })
      .map(function (collection) { return collection.coin_id; });
    updateBonus(collectedCoinIds.length * cfg.coin_bonus);
  }

  function applyPosition(player) {
    var playerId = String(player.participant_id);
    if (playerId === participantId) return;
    var existing = players[playerId] || (players[playerId] = {});
    Object.assign(existing, player);
    existing.received_at = performance.now();
  }

  function applyCollection(msg) {
    var collection = msg.collection || {};
    coins = (msg.coins || coins).filter(function (coin) {
      return coin.id !== collection.coin_id;
    });
    delete pendingCollections[collection.coin_id];
    if (String(collection.participant_id) === participantId) {
      collectedCoinIds.push(collection.coin_id);
      updateBonus(bonus + cfg.coin_bonus);
    }
  }

  function handleCollectRejected(msg) {
    delete pendingCollections[msg.coin_id];
  }

  function integrateOwnPlayer(now) {
    var dt = Math.min(0.08, (now - lastDrawAt) / 1000);
    var acceleration = 900;
    var friction = 0.90;
    var maxSpeed = 260;
    var ax = 0;
    var ay = 0;
    if (keys.ArrowLeft) ax -= acceleration;
    if (keys.ArrowRight) ax += acceleration;
    if (keys.ArrowUp) ay -= acceleration;
    if (keys.ArrowDown) ay += acceleration;
    own.vx = (Number(own.vx) || 0) + ax * dt;
    own.vy = (Number(own.vy) || 0) + ay * dt;
    if (!ax) own.vx *= friction;
    if (!ay) own.vy *= friction;
    var speed = Math.hypot(own.vx, own.vy);
    if (speed > maxSpeed) {
      own.vx = own.vx / speed * maxSpeed;
      own.vy = own.vy / speed * maxSpeed;
    }
    own.x = Math.max(cfg.player_radius, Math.min(cfg.canvas_size - cfg.player_radius, own.x + own.vx * dt));
    own.y = Math.max(cfg.player_radius, Math.min(cfg.canvas_size - cfg.player_radius, own.y + own.vy * dt));
    own.client_time = now;
    own.received_at = now;
    players[participantId] = own;
  }

  function drawPlayer(playerId, player, now) {
    var age = Math.min(160, now - (player.received_at || now)) / 1000;
    var x = Number(player.x || 0) + Number(player.vx || 0) * age;
    var y = Number(player.y || 0) + Number(player.vy || 0) * age;
    var isOwn = String(playerId) === participantId;
    ctx.beginPath();
    ctx.arc(x, y, cfg.player_radius, 0, Math.PI * 2);
    ctx.fillStyle = player.color || (isOwn ? "#1f77b4" : "#d62728");
    ctx.fill();
    ctx.lineWidth = isOwn ? 4 : 2;
    ctx.strokeStyle = isOwn ? "#111827" : "#ffffff";
    ctx.stroke();
  }

  function draw(now) {
    integrateOwnPlayer(now);
    ctx.clearRect(0, 0, cfg.canvas_size, cfg.canvas_size);
    ctx.fillStyle = "#f8fbff";
    ctx.fillRect(0, 0, cfg.canvas_size, cfg.canvas_size);
    ctx.strokeStyle = "#d8e2ef";
    ctx.lineWidth = 1;
    for (var grid = 80; grid < cfg.canvas_size; grid += 80) {
      ctx.beginPath();
      ctx.moveTo(grid, 0);
      ctx.lineTo(grid, 0 + cfg.canvas_size);
      ctx.moveTo(0, grid);
      ctx.lineTo(cfg.canvas_size, grid);
      ctx.stroke();
    }
    coins.forEach(function (coin) {
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, coin.radius || cfg.coin_radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f4c430";
      ctx.fill();
      ctx.strokeStyle = "#a27400";
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    Object.keys(players).forEach(function (playerId) {
      drawPlayer(playerId, players[playerId], now);
    });
    checkCoinCollections();
    lastDrawAt = now;
  }

  function checkCoinCollections() {
    coins.forEach(function (coin) {
      if (pendingCollections[coin.id]) return;
      var distance = Math.hypot(Number(coin.x) - own.x, Number(coin.y) - own.y);
      if (distance <= (coin.radius || cfg.coin_radius) + cfg.player_radius) {
        pendingCollections[coin.id] = true;
        psynet.websocket.send("collect", {
          coin_id: coin.id,
          x: own.x,
          y: own.y,
          client_time: performance.now()
        });
      }
    });
  }

  function sendPosition() {
    psynet.websocket.send("position", {
      x: own.x,
      y: own.y,
      vx: own.vx,
      vy: own.vy,
      client_time: performance.now()
    });
  }

  function submitFinalAnswer() {
    if (submitted) return;
    submitted = true;
    psynet.nextPage({
      final_position: {x: own.x, y: own.y, vx: own.vx, vy: own.vy},
      n_collected_coins: collectedCoinIds.length
    });
  }

  function focusCanvas() {
    if (document.activeElement !== canvas) {
      canvas.focus();
    }
  }

  function arrowKeyForEvent(event) {
    if (arrowKeys.indexOf(event.key) >= 0) return event.key;
    if (arrowKeys.indexOf(event.code) >= 0) return event.code;
    return null;
  }

  function isTextInput(target) {
    var tagName = target && target.tagName ? target.tagName.toLowerCase() : "";
    return tagName === "input" || tagName === "textarea" || tagName === "select" ||
      Boolean(target && target.isContentEditable);
  }

  function handleArrowKeyDown(event) {
    if (isTextInput(event.target)) return;
    var key = arrowKeyForEvent(event);
    if (!key) return;
    event.preventDefault();
    focusCanvas();
    var wasPressed = Boolean(keys[key]);
    keys[key] = true;
    if (!wasPressed) {
      draw(performance.now());
      sendPosition();
    }
  }

  function handleArrowKeyUp(event) {
    var key = arrowKeyForEvent(event);
    if (!key) return;
    keys[key] = false;
    event.preventDefault();
    sendPosition();
  }

  function handleWindowBlur() {
    keys = {};
  }

  function setGameInterval(handler, interval) {
    var intervalId = setInterval(handler, interval);
    gameIntervalIds.push(intervalId);
  }

  psynet.addPageEventListener(canvas, "click", focusCanvas);
  psynet.addPageEventListener(window, "keydown", handleArrowKeyDown, true);
  psynet.addPageEventListener(window, "keyup", handleArrowKeyUp, true);
  psynet.addPageEventListener(window, "blur", handleWindowBlur);
  psynet.addPageCleanupCallback(function () {
    gameIntervalIds.forEach(clearInterval);
    gameIntervalIds = [];
    keys = {};
  });
  focusCanvas();

  psynet.session.init(liveSession);
  psynet.session.onFreshState(applySnapshot);
  psynet.session.onStarted(startGame);
  psynet.session.onEnd(submitFinalAnswer);
  psynet.session.ready();

  psynet.websocket.handle("position_update", function (msg) {
    applyPosition(msg.player);
  });
  psynet.websocket.handle("coin_collected", function (msg) {
    applyCollection(msg);
  });
  psynet.websocket.handle("collect_rejected", function (msg) {
    handleCollectRejected(msg);
  });

  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    startedAt = performance.now();
    setGameInterval(function () { draw(performance.now()); }, cfg.draw_interval_ms);
    setGameInterval(sendPosition, cfg.send_interval_ms);
    setGameInterval(function () {
      if (performance.now() - startedAt >= cfg.trial_seconds * 1000) submitFinalAnswer();
    }, 200);
  }
});
</script>
{% endmacro %}
