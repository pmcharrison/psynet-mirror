schema_version = "1.0"
method = "fixed-budget adaptive policy benchmark"

[design]
observation_budgets = [100, 300]
policies = ["adaptive", "random"]

[assumptions]
scenarios = ["matching", "misspecified"]
refit_every = 50
bootstrap_replicates = 128

[simulation]
replicates = 3
base_seed = 20260830

[decision]
primary_metric = "rmse"
criterion = "Adaptive mean RMSE should not exceed random mean RMSE at 300 observations."
