# Deployment selection is independent of Git. Paths are literal,
# root-relative prefixes; globs and negation are not supported.
version = 1

exclude = [
    ".deploy",
    ".env",
    ".pytest_cache",
    ".venv",
    ".python-version",
    "__pycache__",
    "data",
    "deploy",
    "deploy_logs",
    "develop",
    "local_only",
    "logs.jsonl",
    "node_modules",
    "server.log",
    "snapshots",
    "source_code.zip",
    "static/assets",
]
