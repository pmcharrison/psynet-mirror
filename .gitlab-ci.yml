image: docker:20.10.16

services:
  - docker:20.10.16-dind
  - postgres:12.2-alpine
  - redis:latest

variables:
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  POSTGRES_DB: dallinger
  POSTGRES_USER: dallinger
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://dallinger@postgres:5432/dallinger
  REDIS_URL: redis://redis:6379
  HEADLESS: "TRUE"
  DOCKER_REGISTRY_BASE: registry.gitlab.com/psynetdev/psynet
  DOCKER_IMAGE_CACHE_FROM: "$DOCKER_REGISTRY_BASE:master"
  DOCKER_LOCAL_TAG: psynet-build
  DOCKER_REMOTE_TAG: "$DOCKER_REGISTRY_BASE:$CI_COMMIT_REF_NAME"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - export POSTGRES_IP=$(getent hosts postgres  | awk '{ print $1 }')
  - export REDIS_IP=$(getent hosts redis  | awk '{ print $1 }')
  - echo $POSTGRES_IP
  - echo $REDIS_IP
  - docker image prune --all --force
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  - docker pull $DOCKER_IMAGE_CACHE_FROM || true
  - docker build --cache-from $DOCKER_IMAGE_CACHE_FROM --tag $DOCKER_LOCAL_TAG .

pre_commit:
  image: python:3.11.6
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files

tests:
  parallel: 10
  stage: test
  script:
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      $DOCKER_LOCAL_TAG bash -c
      "pytest -s --test-group-count $CI_NODE_TOTAL --test-group=$CI_NODE_INDEX
      --test-group-random-seed=12345 --ignore=tests/local_only --ignore=tests/isolated --chrome tests"

# We use the -s flag in pytest to disable output capture, so that all print output is shown in the GitLab CI logs.
# Ideally we would capture output and only print it when the test fails, but we've found that the output capture
# misses output from background processes which makes things difficult to debug.
# One solution to this would be to try and work out exactly what is going on with the stdout handling,
# and why it works locally but fails on the CI. Another solution might be refactor the code to get rid of
# the hierarchical calling of pytest, and instead run all the tests in a single pytest session.
# The latter would require fixing some earlier experienced problems with SQLAlchemy getting confused when we try to
# import different experiments in the same session. SQLAlchemy's confusions seem to occur when we have multiple
# classes in different experiments with the same name, for example CustomTrial. It's not clear how we could work around
# this, other than making sure that all the classes have distinct names, but this is a bit awkward given the large
# number of demos.

deploy_docker:
  stage: deploy
  script:
    - echo "Pushing Docker image to $DOCKER_REMOTE_TAG..."
    - docker tag "$DOCKER_LOCAL_TAG" "$DOCKER_REMOTE_TAG"
    - docker push "$DOCKER_REMOTE_TAG"
  only:
    - tags
    - master

# To do:
# - Skip tests if the changes are only in the docs directory
# - The Docker build step in before_script is redundant if we're already using the pushed Docker image here
pages:
  image: $DOCKER_REMOTE_TAG
  stage: deploy
  needs: [deploy_docker]
  script:
    - pip install -U sphinx
    - pip install furo
    - pip install polib
    - pip install sphinx-autodoc-typehints
    - sphinx-build -b html docs public
  artifacts:
    paths:
    - public
  only:
    - master
