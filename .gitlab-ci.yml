image: docker:26.1.1

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

services:
  - docker:26.1.1-dind
  - postgres:16.2-bookworm
  - redis:latest

variables:
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  POSTGRES_DB: dallinger
  POSTGRES_USER: dallinger
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://dallinger@postgres:5432/dallinger
  REDIS_URL: redis://redis:6379
  HEADLESS: "TRUE"
  DOCKER_LOCAL_TAG: psynet-build
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - export POSTGRES_IP=$(getent ahostsv4 postgres | awk '{ print $1 }' | tail -n 1)
  - export REDIS_IP=$(getent ahostsv4 redis | awk '{ print $1 }' | tail -n 1)
  - echo $POSTGRES_IP
  - echo $REDIS_IP
  - docker build --tag $DOCKER_LOCAL_TAG .

.default_rules: &default_rules
  rules:
    - if: $CI_COMMIT_BRANCH == "969-migrate-docs-to-pydata-theme"
      when: never
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always

pre_commit:
  image: python:3.13
  <<: *default_rules
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files

changelog_check:
  image:
    name: alpine/git
    entrypoint: ["/bin/sh", "-c"]
  stage: test
  before_script: []
  script:
    - |
      git fetch --unshallow origin || git fetch --depth=100 origin
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      MERGE_BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD)
      git diff --name-only $MERGE_BASE HEAD > /tmp/changed_files.txt
      if grep -q '^CHANGELOG.md$' /tmp/changed_files.txt; then
        echo "CHANGELOG.md found in changed files."
      else
        echo "ERROR: Merge requests must include a corresponding entry in CHANGELOG.md."
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "969-migrate-docs-to-pydata-theme"
      when: never
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never

tests:
  parallel: 10
  stage: test
  <<: *default_rules
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e CI -e CI_NODE_TOTAL -e CI_NODE_INDEX
      -e CI_COMMIT_REF_NAME
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -v "$PWD/public:/public"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c "bash run-ci-tests.sh"
  artifacts:
    paths:
      - public/

playwright_e2e:
  stage: test
  <<: *default_rules
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - mkdir -p public test-results
    - docker build --build-arg BASE_IMAGE=$DOCKER_LOCAL_TAG --tag $DOCKER_LOCAL_TAG-playwright -f Dockerfile.playwright .
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=public/playwright-junit.xml
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG-playwright bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && npm ci && npx playwright test tests/playwright/demos --reporter=line,junit,html"
  artifacts:
    when: always
    paths:
      - public/
      - test-results/
      - playwright-report/
    reports:
      junit: public/playwright-junit.xml

merge_test_results:
  image: python:3.13-alpine
  stage: test
  <<: *default_rules
  needs: ["tests", "playwright_e2e"]
  dependencies: ["tests", "playwright_e2e"]
  when: always
  before_script:
    - pip install -q junitparser
  script:
    - ls -la public
    - junitparser merge public/*junit.xml junit.xml || echo "<testsuite></testsuite>" > junit.xml
  artifacts:
    reports:
      junit: junit.xml

# To do:
# - Skip tests if the changes are only in the docs directory
# Build and publish the multi-version docs site to GitLab Pages. Runs in
# two modes:
# - Default-branch (or migration-branch) pipeline: full rebuild of the
#   site — highest stable to public/, selected (major,minor) tags to
#   public/<tag>/, and master HEAD to public/alpha/.
# - Prerelease tag pipeline (vX.Y.Z(rc|a)N): adds a single subdirectory
#   at public/rc/<tag>/ for the tagged docs.
# Both modes end by syncing the latest version_switcher.json into every
# public/**/_static/version_switcher.json so cached subdirs whose HTML
# predates the absolute-URL switch still pick up new entries.
pages:
  image: python:3.13
  stage: deploy
  variables:
    # Single absolute URL so every versioned subdir loads the same JSON.
    # Without this, each subdir's HTML embeds a relative
    # `_static/version_switcher.json` reference and a per-subdir copy
    # of the file, so updating the switcher would require rewriting
    # every subdir.
    DOCS_VERSION_SWITCHER_JSON: "https://psynetdev.gitlab.io/PsyNet/_static/version_switcher.json"
  cache:
    key: psynet-versioned-docs-cache
    paths:
      - public/
    policy: pull-push
  before_script: []
  script:
    - pip install -e '.[dev]'
    - pip install furo pydata-sphinx-theme
    - export ALPHA_REF="$CI_DEFAULT_BRANCH"
    - git fetch --tags --force origin "$CI_DEFAULT_BRANCH"
    - python docs/scripts/generate_version_switcher.py --default-branch "$ALPHA_REF" --output docs/_static/version_switcher.json
    - |
      build_docs_from_ref () {
        REF="$1"
        OUTPUT_DIR="$2"
        DOCS_DISPLAY_VERSION="$3"
        WORKTREE_DIR=$(mktemp -d)
        git worktree add --detach "$WORKTREE_DIR" "$REF"
        mkdir -p "$WORKTREE_DIR/docs/_static"
        cp docs/_static/version_switcher.json "$WORKTREE_DIR/docs/_static/version_switcher.json"
        DOCS_VERSION="$DOCS_DISPLAY_VERSION" sphinx-build -D version="$DOCS_DISPLAY_VERSION" -D release="$DOCS_DISPLAY_VERSION" -b html "$WORKTREE_DIR/docs" "$OUTPUT_DIR"
        git worktree remove --force "$WORKTREE_DIR"
      }

      mkdir -p public

      if [ -n "$CI_COMMIT_TAG" ]; then
        # Prerelease tag pipeline: build only the tagged docs into a
        # new public/rc/<tag>/ subdirectory, leaving the cached site
        # (root, alpha, stable subdirs) untouched.
        build_docs_from_ref "$CI_COMMIT_TAG" "public/rc/$CI_COMMIT_TAG" "$CI_COMMIT_TAG"
      else
        # Branch pipeline: full rebuild of stable + alpha.
        export HIGHEST_STABLE=$(python docs/scripts/generate_version_switcher.py --print-highest-stable)
        export SELECTED_STABLE_TAGS=$(python docs/scripts/generate_version_switcher.py --print-selected-stable-tags)
        export ALPHA_VERSION=$(python docs/scripts/generate_version_switcher.py --default-branch "$ALPHA_REF" --print-alpha-version)

        ROOT_TMP_DIR=$(mktemp -d)
        build_docs_from_ref "$HIGHEST_STABLE" "$ROOT_TMP_DIR" "$HIGHEST_STABLE"
        cp -a "$ROOT_TMP_DIR"/. public/
        rm -rf "$ROOT_TMP_DIR"

        for VERSION_TAG in $SELECTED_STABLE_TAGS; do
          if [ -f "public/$VERSION_TAG/index.html" ]; then
            echo "Skipping rebuild for existing version: $VERSION_TAG"
            continue
          fi
          build_docs_from_ref "$VERSION_TAG" "public/$VERSION_TAG" "$VERSION_TAG"
        done

        build_docs_from_ref "origin/$ALPHA_REF" "public/alpha" "$ALPHA_VERSION"
      fi

      # Sync the latest version_switcher.json into every existing
      # _static directory under public/. Handles cached subdirs whose
      # HTML was built before the absolute-URL switch (and so still
      # references a relative path), plus belt-and-suspenders for
      # fresh builds. Uses `\;` (one cp per match) instead of `+`,
      # because `+` collapses all matches into a single
      # `cp src match1 match2 ... matchN` invocation, which cp would
      # interpret as "copy src and match1..matchN-1 *into* matchN as
      # a directory" and fail with "Not a directory" once more than
      # one match exists.
      mkdir -p public/_static
      cp docs/_static/version_switcher.json public/_static/version_switcher.json
      find public -path '*/_static/version_switcher.json' -exec cp docs/_static/version_switcher.json {} \;
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "969-migrate-docs-to-pydata-theme"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(rc|a)\d+$/
      when: always
    - when: never

