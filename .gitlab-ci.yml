image: docker:26.1.1

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Avoid duplicate pipelines: when a branch has an open MR, only run the
    # MR pipeline (not the branch pipeline) for pushes to that branch.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

services:
  - docker:26.1.1-dind
  - postgres:16.2-bookworm
  - redis:latest

variables:
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  POSTGRES_DB: dallinger
  POSTGRES_USER: dallinger
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://dallinger@postgres:5432/dallinger
  REDIS_URL: redis://redis:6379
  HEADLESS: "TRUE"
  DOCKER_LOCAL_TAG: psynet-build
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - export POSTGRES_IP=$(getent ahostsv4 postgres | awk '{ print $1 }' | tail -n 1)
  - export REDIS_IP=$(getent ahostsv4 redis | awk '{ print $1 }' | tail -n 1)
  - echo $POSTGRES_IP
  - echo $REDIS_IP
  - docker build --tag $DOCKER_LOCAL_TAG .

.default_rules: &default_rules
  rules:
    - if: $CI_COMMIT_BRANCH == "969-migrate-docs-to-pydata-theme"
      when: never
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always

pre_commit:
  image: python:3.13
  <<: *default_rules
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files

changelog_check:
  image: python:3.13
  stage: test
  before_script:
    - python -m pip install -e .
  script:
    - |
      git fetch --unshallow origin || git fetch --depth=100 origin
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      MERGE_BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD)
      psynet dev changelog check-mr $MERGE_BASE HEAD
  rules:
    - if: $CI_COMMIT_BRANCH == "969-migrate-docs-to-pydata-theme"
      when: never
    # Temporary bootstrap exception: this migration MR intentionally edits
    # CHANGELOG.md while introducing fragments-only enforcement. Remove after merge.
    - if: $CI_COMMIT_BRANCH == "1039-propose-and-implement-new-changelog-system-in-psynet" || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "1039-propose-and-implement-new-changelog-system-in-psynet"
      when: never
    # Release branches regenerate CHANGELOG.md from fragments.
    - if: $CI_COMMIT_BRANCH =~ /^release-/ || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release-/
      when: never
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never

tests:
  parallel: 10
  stage: test
  <<: *default_rules
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e CI -e CI_NODE_TOTAL -e CI_NODE_INDEX
      -e CI_COMMIT_REF_NAME
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -v "$PWD/public:/public"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c "bash run-ci-tests.sh"
  artifacts:
    paths:
      - public/

playwright_e2e:
  stage: test
  <<: *default_rules
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - mkdir -p public test-results
    - docker build --build-arg BASE_IMAGE=$DOCKER_LOCAL_TAG --tag $DOCKER_LOCAL_TAG-playwright -f Dockerfile.playwright .
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e AWS_ACCESS_KEY_ID -e AWS_DEFAULT_REGION -e AWS_SECRET_ACCESS_KEY
      -e PLAYWRIGHT_JUNIT_OUTPUT_NAME=public/playwright-junit.xml
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG-playwright bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && npm ci && npx playwright test tests/playwright/demos --reporter=line,junit,html"
  artifacts:
    when: always
    paths:
      - public/
      - test-results/
      - playwright-report/
    reports:
      junit: public/playwright-junit.xml

merge_test_results:
  image: python:3.13-alpine
  stage: test
  <<: *default_rules
  needs: ["tests", "playwright_e2e"]
  dependencies: ["tests", "playwright_e2e"]
  when: always
  before_script:
    - pip install -q junitparser
  script:
    - ls -la public
    - junitparser merge public/*junit.xml junit.xml || echo "<testsuite></testsuite>" > junit.xml
  artifacts:
    reports:
      junit: junit.xml

asv_benchmarks:
  stage: test
  resource_group: benchmark-results
  cache:
    key:
      files:
        - pyproject.toml
        - asv.conf.json
    paths:
      - .asv/env/
  script:
    - apk add --no-cache git
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - export ASV_RESULTS_REMOTE="https://oauth2:${BENCHMARK_RESULTS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config user.email "ci@psynet.dev"
    - git config user.name "PsyNet CI"
    - git branch -f "$CI_COMMIT_REF_NAME" HEAD
    - 'sed -i "s|\"branches\": \[[^]]*\]|\"branches\": [\"$CI_COMMIT_REF_NAME\"]|" asv.conf.json'
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e CI -e CI_COMMIT_REF_NAME
      -e PSYNET_WORKSPACE
      -e ASV_MACHINE_NAME=gitlab-ci
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && uv pip install --no-cache --system asv virtualenv && bash ci/asv-sync-results.sh"
    - git push "$ASV_RESULTS_REMOTE" benchmark-results
  artifacts:
    when: on_failure
    paths:
      - .asv/results/
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: always
    - when: never

# Gate merge requests on benchmark regressions. Runs `asv continuous`, which
# builds and benchmarks both commits back-to-back on the same runner (so
# runner-to-runner noise cancels out) and exits non-zero if any benchmark
# regressed past --factor. The base is the MR's merge base with the target
# branch (CI_MERGE_REQUEST_DIFF_BASE_SHA), and the head is the source branch
# tip -- comparing those two real commits isolates exactly the MR's own
# changes, independent of how far master has moved. Results are not committed
# to the benchmark-results branch; this job is a gate only.
asv_regression:
  stage: test
  resource_group: benchmark-results
  allow_failure: true
  # Runs the full benchmark suite twice (base + head); generous enough to
  # absorb a cold .asv/env cache and a slow shared runner without flaking.
  timeout: 90m
  variables:
    # Full clone: the merge base can be far back in the target branch's
    # history and is otherwise unreachable in the default shallow clone.
    GIT_DEPTH: "0"
  cache:
    key:
      files:
        - pyproject.toml
        - asv.conf.json
    paths:
      - .asv/env/
  script:
    - apk add --no-cache git
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    # The full clone above already has the source tip and the merge base;
    # fetch the target branch as a defensive backstop. Fetching the source
    # branch by name is avoided -- it fails for fork-originated merge requests.
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export ASV_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    # SOURCE_BRANCH_SHA is set in merged-results pipelines; in a standard MR
    # pipeline it is empty and CI_COMMIT_SHA is itself the source branch tip.
    - export ASV_HEAD="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    - echo "Comparing benchmark base $ASV_BASE -> head $ASV_HEAD"
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e CI
      -e PSYNET_WORKSPACE
      -e ASV_MACHINE_NAME=gitlab-ci
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c "uv pip install --no-cache --system --no-deps -e \"$PSYNET_WORKSPACE\" && uv pip install --no-cache --system asv virtualenv && asv machine --yes --machine gitlab-ci && asv continuous --factor 1.25 --split --show-stderr $ASV_BASE $ASV_HEAD"
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "issues/9123-performance-benchmark-site"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - when: never

# Manual, on-demand load sweep. Runs `psynet performance-test` across a range of
# concurrency levels for each benchmarked demo to locate the throughput "knee"
# on GitLab runner hardware -- the data needed to tune the n_bots and duration
# of the ASV experiment benchmarks. It is offered on every pipeline as a
# manual job.
benchmark_load_sweep:
  stage: test
  resource_group: benchmark-results
  timeout: 90m
  script:
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - mkdir -p public
    - docker run
      --add-host=postgres:$POSTGRES_IP
      --add-host=redis:$REDIS_IP
      -e HEADLESS=TRUE -e REDIS_URL -e DATABASE_URL -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
      -e CI
      -e PSYNET_WORKSPACE
      -v "$PWD:$PSYNET_WORKSPACE"
      -w $PSYNET_WORKSPACE
      $DOCKER_LOCAL_TAG bash -c 'uv pip install --no-cache --system --no-deps -e "$PSYNET_WORKSPACE" && sweep() { echo "=== load sweep $2 ==="; ( cd "$1" && psynet performance-test local --n-bots "$3" --duration-minutes "$4" --json-output "$PSYNET_WORKSPACE/public/sweep-$2.json" ); } && sweep demos/experiments/static static "5,6,7" 2.0 && sweep demos/experiments/timeline timeline "8,12,16,24" 5.0 && sweep tests/experiments/static_big static_big "5,6" 2.0 && python3 ci/perf-sweep-report.py public/sweep-*.json | tee public/sweep-report.md'
  artifacts:
    when: always
    paths:
      - public/sweep-*.json
      - public/sweep-report.md
  rules:
    - when: manual
      allow_failure: true

# To do:
# - Skip tests if the changes are only in the docs directory
pages_latest:
  image: python:3.13
  stage: deploy
  cache:
    key: psynet-versioned-docs-cache
    paths:
      - public/
    policy: pull-push
  before_script: []
  script:
    - pip install -e '.[dev]'
    - pip install furo pydata-sphinx-theme
    - export ALPHA_REF="$CI_DEFAULT_BRANCH"
    - git fetch --tags --force origin "$CI_DEFAULT_BRANCH" "$ALPHA_REF"
    - python docs/scripts/generate_version_switcher.py --default-branch "$ALPHA_REF" --output docs/_static/version_switcher.json
    - export HIGHEST_STABLE=$(python docs/scripts/generate_version_switcher.py --print-highest-stable)
    - export SELECTED_STABLE_TAGS=$(python docs/scripts/generate_version_switcher.py --print-selected-stable-tags)
    - export ALPHA_VERSION=$(python docs/scripts/generate_version_switcher.py --default-branch "$ALPHA_REF" --print-alpha-version)
    - |
      build_docs_from_ref () {
        REF="$1"
        OUTPUT_DIR="$2"
        DOCS_DISPLAY_VERSION="$3"
        WORKTREE_DIR=$(mktemp -d)
        git worktree add --detach "$WORKTREE_DIR" "$REF"
        mkdir -p "$WORKTREE_DIR/docs/_static"
        cp docs/_static/version_switcher.json "$WORKTREE_DIR/docs/_static/version_switcher.json"
        DOCS_VERSION="$DOCS_DISPLAY_VERSION" sphinx-build -D version="$DOCS_DISPLAY_VERSION" -D release="$DOCS_DISPLAY_VERSION" -b html "$WORKTREE_DIR/docs" "$OUTPUT_DIR"
        git worktree remove --force "$WORKTREE_DIR"
      }

      mkdir -p public

      ROOT_TMP_DIR=$(mktemp -d)
      build_docs_from_ref "$HIGHEST_STABLE" "$ROOT_TMP_DIR" "$HIGHEST_STABLE"
      cp -a "$ROOT_TMP_DIR"/. public/
      rm -rf "$ROOT_TMP_DIR"

      for VERSION_TAG in $SELECTED_STABLE_TAGS; do
        if [ -f "public/$VERSION_TAG/index.html" ]; then
          echo "Skipping rebuild for existing version: $VERSION_TAG"
          continue
        fi
        build_docs_from_ref "$VERSION_TAG" "public/$VERSION_TAG" "$VERSION_TAG"
      done

      build_docs_from_ref "origin/$ALPHA_REF" "public/alpha" "$ALPHA_VERSION"
    - export ASV_RESULTS_REMOTE="https://oauth2:${BENCHMARK_RESULTS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      if git ls-remote --exit-code --heads "$ASV_RESULTS_REMOTE" benchmark-results >/dev/null 2>&1; then
        git fetch "$ASV_RESULTS_REMOTE" benchmark-results:benchmark-results
        git branch -f "$CI_COMMIT_REF_NAME" HEAD
        sed -i "s|\"branches\": \[[^]]*\]|\"branches\": [\"$CI_COMMIT_REF_NAME\"]|" asv.conf.json
        git worktree add .asv/results benchmark-results
        asv publish
        mkdir -p public/benchmarks
        cp -a .asv/html/. public/benchmarks/
        git worktree remove --force .asv/results
      else
        echo "benchmark-results branch not on remote yet; skipping asv publish"
      fi
  pages: true
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_BRANCH == "969-migrate-docs-to-pydata-theme"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

