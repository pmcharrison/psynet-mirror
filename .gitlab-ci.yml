image: docker:26.1.1

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

services:
  - docker:26.1.1-dind
  - postgres:16.2-bookworm
  - redis:latest

variables:
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  POSTGRES_DB: dallinger
  POSTGRES_USER: dallinger
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust
  DATABASE_URL: postgresql://dallinger@postgres:5432/dallinger
  REDIS_URL: redis://redis:6379
  HEADLESS: "TRUE"
  DOCKER_LOCAL_TAG: psynet-build
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - export POSTGRES_IP=$(getent ahostsv4 postgres | awk '{ print $1 }' | tail -n 1)
  - export REDIS_IP=$(getent ahostsv4 redis | awk '{ print $1 }' | tail -n 1)
  - echo $POSTGRES_IP
  - echo $REDIS_IP
  - docker build --tag $DOCKER_LOCAL_TAG .

.default_rules: &default_rules
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
    - if: $CI_COMMIT_TAG
      when: always

pre_commit:
  image: python:3.13
  <<: *default_rules
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files

changelog_check:
  image:
    name: alpine/git
    entrypoint: ["/bin/sh", "-c"]
  stage: test
  before_script: []
  script:
    - |
      git fetch --unshallow origin || git fetch --depth=100 origin
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      MERGE_BASE=$(git merge-base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME HEAD)
      git diff --name-only $MERGE_BASE HEAD > /tmp/changed_files.txt
      if grep -q '^CHANGELOG.md$' /tmp/changed_files.txt; then
        echo "CHANGELOG.md found in changed files."
      else
        echo "ERROR: Merge requests must include a corresponding entry in CHANGELOG.md."
        exit 1
      fi
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - when: never

tests:
  parallel: 10
  stage: test
  <<: *default_rules
  script:
    - mkdir -p public
    - export PSYNET_WORKSPACE=/root/workspaces/PsyNet
    - bash ci/run-ci-docker-command.sh "$DOCKER_LOCAL_TAG" "$PSYNET_WORKSPACE" "$PSYNET_WORKSPACE" bash -c "bash run-ci-tests.sh"
  artifacts:
    paths:
      - public/

test_docker_experiments:
  stage: test
  <<: *default_rules
  script:
    - mkdir -p public
    - export TIMEOUT_SECONDS=300
    - |
      docker run --rm -v "$PWD:/workspace" -w /workspace "$DOCKER_LOCAL_TAG" \
        bash -lc "psynet list-docker-build-experiments --relative" \
        > /tmp/docker-build-experiments.txt
    - |
      if [ ! -s /tmp/docker-build-experiments.txt ]; then
        echo "No docker-build experiments configured."
        exit 0
      fi

      EXIT_CODE=0
      while IFS= read -r experiment_dir; do
        [ -z "$experiment_dir" ] && continue

        experiment_name=$(basename "$experiment_dir")
        image_tag="custom-${experiment_name}"

        echo "Building Docker image for $experiment_dir"
        docker build --tag "$image_tag" "$experiment_dir"

        echo "Running tests for $experiment_dir"
        if ! bash ci/run-ci-docker-command.sh "$image_tag" "/workspace" "/workspace/$experiment_dir" \
          bash -c "pytest --junitxml=/public/${experiment_name}_junit.xml test.py -Werror -W \"ignore:color, on_color and attrs are not supported when output stream is not a TTY:UserWarning:yaspin.core\" -q -o log_cli=False --chrome --timeout=$TIMEOUT_SECONDS"; then
          EXIT_CODE=1
        fi
      done < /tmp/docker-build-experiments.txt

      exit $EXIT_CODE
  artifacts:
    paths:
      - public/

merge_test_results:
  image: python:3.13-alpine
  stage: test
  <<: *default_rules
  needs: ["tests", "test_docker_experiments"]
  dependencies: ["tests", "test_docker_experiments"]
  when: always
  before_script:
    - pip install -q junitparser
  script:
    - ls -la public
    - junitparser merge public/*junit.xml junit.xml || echo "<testsuite></testsuite>" > junit.xml
  artifacts:
    reports:
      junit: junit.xml

# To do:
# - Skip tests if the changes are only in the docs directory
pages:
  image: python:3.13
  stage: deploy
  before_script: []
  script:
    - pip install -e '.[dev]'
    - sphinx-build -b html docs public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      when: always
    - when: never
