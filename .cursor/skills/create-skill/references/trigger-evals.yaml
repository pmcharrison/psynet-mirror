# Trigger eval queries for PsyNet Agent Skills (dogfooding / description tuning).
# Pass when the skill should load for should_trigger: true queries and stay idle
# for should_trigger: false near-misses. Re-run after description edits.
#
# Usage: manual review during skill work, or scripted checks when your agent
# client exposes skill-invocation logs.

